  <!-- Card 1 -->
  <rect x="36" y="132" width="166" height="220" rx="6" fill="#1b1b22" stroke="#282833"/>
  <rect x="46" y="142" width="146" height="104" rx="4" fill="#121217"/>
  <!-- Minimalist Watch Graphic -->
  <circle cx="119" cy="194" r="28" fill="#191922" stroke="#c92a34" stroke-width="2"/>
  <line x1="119" y1="194" x2="119" y2="180" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="119" y1="194" x2="130" y2="194" stroke="#c92a34" stroke-width="1.8" stroke-linecap="round"/>
  <rect x="116" y="156" width="6" height="10" rx="1" fill="#2d2d3d"/>
  <rect x="116" y="222" width="6" height="10" rx="1" fill="#2d2d3d"/>

  <text x="48" y="264" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="12">Chronograph Onyx</text>
  <text x="48" y="280" fill="#757582" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5">Titanium Grade 5</text>
  <text x="48" y="304" fill="#c92a34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="14">$485</text>

