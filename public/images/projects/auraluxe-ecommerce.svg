  <rect x="104" y="96" width="76" height="22" rx="4" fill="#1c1c24" stroke="#2c2c38"/>
  <text x="142" y="111" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" text-anchor="middle">Footwear</text>

  <rect x="188" y="96" width="86" height="22" rx="4" fill="#1c1c24" stroke="#2c2c38"/>
  <text x="231" y="111" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" text-anchor="middle">Timepieces</text>

  <rect x="282" y="96" width="86" height="22" rx="4" fill="#1c1c24" stroke="#2c2c38"/>
  <text x="325" y="111" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10" text-anchor="middle">Accessories</text>

