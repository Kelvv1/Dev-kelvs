  <text x="119" y="332" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600" font-size="10" text-anchor="middle">+ Add to Cart</text>

  <!-- Card 2 -->
  <rect x="217" y="132" width="166" height="220" rx="6" fill="#1b1b22" stroke="#282833"/>
  <rect x="227" y="142" width="146" height="104" rx="4" fill="#121217"/>
  <!-- Minimalist Leather Bag Graphic -->
  <rect x="268" y="176" width="64" height="48" rx="4" fill="#242430" stroke="#c92a34" stroke-width="1.5"/>
  <path d="M282 176 C282 164 318 164 318 176" fill="none" stroke="#c92a34" stroke-width="1.8"/>
  <line x1="268" y1="192" x2="332" y2="192" stroke="#181822" stroke-width="1.5"/>
  <circle cx="300" cy="200" r="2.5" fill="#c92a34"/>

  <text x="229" y="264" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="12">Aerolite Weekender</text>
  <text x="229" y="280" fill="#757582" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5">Full Grain Calfskin</text>
  <text x="229" y="304" fill="#c92a34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="14">$340</text>

  <rect x="229" y="316" width="142" height="24" rx="4" fill="#c92a34"/>
  <text x="300" y="332" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600" font-size="10" text-anchor="middle">In Cart (1)</text>

  <!-- Card 3 -->
  <rect x="398" y="132" width="166" height="220" rx="6" fill="#1b1b22" stroke="#282833"/>
  <rect x="408" y="142" width="146" height="104" rx="4" fill="#121217"/>
  <!-- Sneaker Silhouette Graphic -->
  <path d="M 430 214 L 442 198 L 464 194 L 490 194 L 524 208 L 534 220 L 430 220 Z" fill="#242430" stroke="#c92a34" stroke-width="1.5"/>
  <path d="M 442 198 L 468 204" stroke="#c92a34" stroke-width="1.5"/>
  <line x1="428" y1="220" x2="536" y2="220" stroke="#888892" stroke-width="1.8"/>

  <text x="410" y="264" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="12">Quantum Low Runner</text>
  <text x="410" y="280" fill="#757582" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5">Custom Knit / Vibram</text>
  <text x="410" y="304" fill="#c92a34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="14">$295</text>

  <rect x="410" y="316" width="142" height="24" rx="4" fill="#15151b" stroke="#2c2c3a"/>
  <text x="481" y="332" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600" font-size="10" text-anchor="middle">+ Add to Cart</text>
