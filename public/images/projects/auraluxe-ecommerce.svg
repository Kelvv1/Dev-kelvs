<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-label="AuraLuxe E-Commerce Web Application Preview">
  <!-- Solid Matte Dark Background -->
  <rect width="600" height="375" fill="#141419"/>

  <!-- Browser Navigation Bar -->
  <rect x="0" y="0" width="600" height="40" fill="#0f0f13"/>
  <line x1="0" y1="40" x2="600" y2="40" stroke="#25252e" stroke-width="1"/>
  <circle cx="24" cy="20" r="4.5" fill="#c92a34"/>
  <circle cx="40" cy="20" r="4.5" fill="#444452"/>
  <circle cx="56" cy="20" r="4.5" fill="#444452"/>
  <rect x="180" y="9" width="240" height="22" rx="4" fill="#181820" stroke="#2c2c36"/>
  <text x="300" y="24" fill="#8e8e98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5" text-anchor="middle">https://auraluxe-atelier.store</text>

  <!-- Store Header & Cart Badge -->
  <text x="36" y="76" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="16">AURA<tspan fill="#c92a34">LUXE</tspan></text>
  <text x="140" y="74" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5">Collection 2026</text>
  <text x="250" y="74" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5">Lookbook</text>
  <text x="330" y="74" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="11.5">Atelier</text>

