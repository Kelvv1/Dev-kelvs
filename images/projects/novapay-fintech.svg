<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 375" role="img" aria-label="NovaPay Fintech Platform Preview">
  <!-- Solid Matte Dark Background -->
  <rect width="600" height="375" fill="#141419"/>

  <!-- Browser Navigation Bar -->
  <rect x="0" y="0" width="600" height="40" fill="#0f0f13"/>
  <line x1="0" y1="40" x2="600" y2="40" stroke="#25252e" stroke-width="1"/>
  <circle cx="24" cy="20" r="4.5" fill="#c92a34"/>
  <circle cx="40" cy="20" r="4.5" fill="#444452"/>
  <circle cx="56" cy="20" r="4.5" fill="#444452"/>
  <rect x="180" y="9" width="240" height="22" rx="4" fill="#181820" stroke="#2c2c36"/>
