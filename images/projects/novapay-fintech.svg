  <text x="36" y="80" fill="#c92a34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="11" letter-spacing="1.1">NEXT-GENERATION PAYMENTS</text>
  <text x="36" y="110" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="22">Frictionless Borderless</text>
  <text x="36" y="134" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="22">Capital Settlement.</text>

  <text x="36" y="164" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="12">Instant cross-border transfers at institutional rates with zero latency.</text>

  <rect x="36" y="184" width="130" height="34" rx="4" fill="#c92a34"/>
