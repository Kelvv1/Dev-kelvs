  <text x="368" y="147" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="15">₦ 250,000</text>
  <rect x="492" y="118" width="46" height="24" rx="4" fill="#20202a"/>
  <text x="515" y="134" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="11" text-anchor="middle">NGN</text>

  <!-- Switcher Arrow -->
  <circle cx="452" cy="174" r="13" fill="#2b2b36"/>
  <path d="M452 168 L452 180 M449 171 L452 168 L455 171 M449 177 L452 180 L455 177" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Transfer Box 2 -->
  <rect x="356" y="190" width="192" height="52" rx="6" fill="#14141a" stroke="#252532"/>
  <text x="368" y="210" fill="#757582" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9.5">RECIPIENT RECEIVES</text>
  <text x="368" y="231" fill="#10b981" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="15">$ 171.20 USD</text>
  <rect x="492" y="202" width="46" height="24" rx="4" fill="#20202a"/>
  <text x="515" y="218" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="11" text-anchor="middle">USD</text>

  <rect x="356" y="260" width="192" height="36" rx="4" fill="#c92a34"/>
  <text x="452" y="283" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="700" font-size="12" text-anchor="middle">Execute Transfer</text>

  <text x="452" y="320" fill="#757582" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="9.5" text-anchor="middle">Locked Rate • 256-bit AES Protocol</text>

  <!-- Bottom Left Highlights -->
  <rect x="36" y="246" width="262" height="102" rx="6" fill="#1b1b22" stroke="#272733"/>
  <circle cx="56" cy="272" r="10" fill="#142c1e"/>
  <path d="M53 272 L55 274 L59 269" stroke="#10b981" stroke-width="1.8" fill="none"/>
  <text x="76" y="271" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600" font-size="12">Direct Bank Settlement</text>
  <text x="76" y="285" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5">Average delivery speed under 90 seconds</text>

  <circle cx="56" cy="316" r="10" fill="#2e1518"/>
  <path d="M53 316 L55 318 L59 313" stroke="#c92a34" stroke-width="1.8" fill="none"/>
  <text x="76" y="315" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-weight="600" font-size="12">Compliance &amp; Fraud Shield</text>
  <text x="76" y="329" fill="#95959f" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="10.5">Automated KYC / AML security verification</text>
